<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#C97B54" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#7A4A34" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#080D1C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="55%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#E6EDF8" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <g id="paw">
      <ellipse cx="0" cy="14" rx="34" ry="42" />
      <ellipse cx="-42" cy="-38" rx="17" ry="21" transform="rotate(-18 -42 -38)" />
      <ellipse cx="0" cy="-52" rx="17" ry="21" />
      <ellipse cx="42" cy="-38" rx="17" ry="21" transform="rotate(18 42 -38)" />
    </g>
  </defs>

  <rect width="1000" height="625" fill="url(#base)" />
  <rect width="1000" height="625" fill="url(#glow)" />
  <rect width="1000" height="625" fill="url(#grid)" />

  <!-- Trailing prints leading toward the mark, echoing the lost & found path -->
  <g fill="#22D3EE" opacity="0.16">
    <use href="#paw" transform="translate(150,470) scale(0.34) rotate(-8)" />
    <use href="#paw" transform="translate(255,400) scale(0.4) rotate(-4)" />
    <use href="#paw" transform="translate(365,345) scale(0.46) rotate(0)" />
  </g>

  <!-- Primary paw mark -->
  <use href="#paw" transform="translate(560,300) scale(1.9)" fill="#F4E9DD" opacity="0.92" />
  <use href="#paw" transform="translate(560,300) scale(1.9)" fill="none" stroke="#C97B54" stroke-opacity="0.5" stroke-width="1.4" />
</svg>
