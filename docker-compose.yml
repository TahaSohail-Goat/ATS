# Local development infrastructure only.
# Run: docker compose up -d
# App processes (web/api) run natively via `pnpm dev` for fast HMR —
# only stateful infra (DB) is containerized to keep DX fast.
name: ats

services:
  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats_dev
    ports:
      - "5432:5432"
    volumes:
      - ats_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ats_postgres_data:
