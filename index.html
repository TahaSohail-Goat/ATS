<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/brand/ast-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AST Solutions | Software Development &amp; AI Solutions</title>
    <link rel="canonical" href="https://www.astsolutions.dev/" />
    <meta
      name="description"
      content="AST Solutions (AI Software &amp; Technology Solutions) designs and builds custom software, AI features, mobile apps, and cloud systems for growing businesses."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Tracks the active theme, not the OS preference: the site has its own
         light default and an explicit toggle. Kept in sync by the script below
         and by applyTheme() in src/lib/theme.ts. -->
    <meta name="theme-color" content="#E2E8F0" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AST Solutions" />
    <meta property="og:title" content="AST Solutions | Software Development &amp; AI Solutions" />
    <meta
      property="og:description"
      content="AST Solutions (AI Software &amp; Technology Solutions) designs and builds custom software, AI features, mobile apps, and cloud systems for growing businesses."
    />
    <meta property="og:url" content="https://www.astsolutions.dev/" />
    <meta property="og:image" content="https://www.astsolutions.dev/opengraph-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AST Solutions | Software Development &amp; AI Solutions" />
    <meta
      name="twitter:description"
      content="AST Solutions designs and builds custom software, AI features, mobile apps, and cloud systems for growing businesses."
    />
    <meta name="twitter:image" content="https://www.astsolutions.dev/opengraph-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.astsolutions.dev/#organization",
            "name": "AST Solutions",
            "alternateName": ["AST", "AI Software & Technology Solutions"],
            "url": "https://www.astsolutions.dev/",
            "logo": "https://www.astsolutions.dev/brand/ast-logo.jpeg",
            "email": "team@astsolutions.dev",
            "sameAs": [
              "https://instagram.com/ast.dev",
              "https://x.com/ASTshcc",
              "https://www.linkedin.com/company/ai-software-technology-solutions"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.astsolutions.dev/#website",
            "name": "AST Solutions",
            "alternateName": "AST",
            "url": "https://www.astsolutions.dev/",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.astsolutions.dev/#organization" }
          }
        ]
      }
    </script>

    <!-- Applies the saved theme before first paint so there is no flash of the
         wrong scheme. Must stay inline, synchronous, and dependency-free; the
         try/catch is required because reading localStorage throws outright in
         private mode and locked-down browsers. Storage key must match
         THEME_STORAGE_KEY in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ast-theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          var r = document.documentElement;
          r.classList.toggle('light', t === 'light');
          r.classList.toggle('dark', t === 'dark');
          r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#020617' : '#E2E8F0');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ast-canvas text-ast-ink antialiased selection:bg-ast-brand selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
